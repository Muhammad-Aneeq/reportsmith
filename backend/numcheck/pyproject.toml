[project]
name = "numcheck"
version = "0.1.0"
description = "Numeric cross-check for LLM-drafted financial prose: every number in the text must match a supplied figure."
requires-python = ">=3.12"
license = { text = "MIT" }

# The entire third-party surface. Deliberately nothing else: this package is meant to be
# lifted into another repo as a directory move (ORIGIN.md), and every dependency added
# here is a dependency that move would drag along.
dependencies = ["pydantic>=2.13,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9", "mypy>=1.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Not typography — these are characters the tokenizer must RECOGNISE. A real minus sign,
# a no-break thousands separator and a multiplication sign all appear in prose a model
# writes and in figures a spreadsheet emits. Refusing to name them would mean refusing to
# parse them.
allowed-confusables = ["−", "×", "–", "—", " "]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
